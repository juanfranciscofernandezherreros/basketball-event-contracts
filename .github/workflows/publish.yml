name: Publish contracts

on:
  workflow_run:
    workflows: [auto-merge]
    types: [completed]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - id: contract_changes
        name: Check whether the package version or schemas changed
        run: |
          if git diff --quiet HEAD^ HEAD -- pom.xml src/main/avro; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No contract artifact changes; skipping duplicate Maven publication."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.contract_changes.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github

      - name: Publish Maven artifact to GitHub Packages
        if: steps.contract_changes.outputs.changed == 'true'
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete stale KAN-17 bootstrap branch if present
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = 'heads/KAN-17-centralize-avro-contracts';

            try {
              await github.rest.git.getRef({ owner, repo, ref });
            } catch (error) {
              if (error.status === 404) {
                core.info('Stale bootstrap branch already absent.');
                return;
              }
              throw error;
            }

            await github.rest.git.deleteRef({ owner, repo, ref });

            try {
              await github.rest.git.getRef({ owner, repo, ref });
              core.setFailed('Stale bootstrap branch still exists after deletion.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Verified stale bootstrap branch deleted.');
            }
