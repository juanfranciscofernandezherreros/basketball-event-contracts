name: Publish contracts

on:
  workflow_run:
    workflows: [auto-merge]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Detect contract release changes
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- pom.xml src/main/avro; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github

      - name: Publish Maven artifact to GitHub Packages
        if: steps.release.outputs.changed == 'true'
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open README version synchronization PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'automation/sync-readme-version';
            const base = 'main';
            const pom = fs.readFileSync('pom.xml', 'utf8');
            const readme = fs.readFileSync('README.md', 'utf8');
            const version = pom.match(/<revision>([^<]+)<\/revision>/)?.[1];
            if (!version) throw new Error('Cannot determine contract version from pom.xml');

            const updated = readme
              .replace(/^(## Version )\d+\.\d+\.\d+$/m, `$1${version}`)
              .replace(/(<version>)\d+\.\d+\.\d+(<\/version>)/, `$1${version}$2`)
              .replace(/(- `contractVersion`:[^`]*default `)\d+\.\d+\.\d+(`\.)/i, `$1${version}$2`);

            if (updated === readme) {
              core.info(`README.md already references ${version}; no PR is needed.`);
              return;
            }

            const { data: baseRef } = await github.rest.git.getRef({ owner, repo, ref: `heads/${base}` });
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: baseRef.object.sha });
            }

            let existingFileSha;
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: 'README.md', ref: branch });
              existingFileSha = data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: 'README.md', branch,
              message: `docs: sync README with contract ${version} [skip ci]`,
              content: Buffer.from(updated).toString('base64'),
              ...(existingFileSha ? { sha: existingFileSha } : {})
            });

            const { data: openPrs } = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}`, base });
            if (openPrs.length) {
              core.info(`Updated existing README synchronization PR #${openPrs[0].number}.`);
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner, repo, head: branch, base,
                title: `docs: synchronize README version to ${version}`,
                body: `Automatically generated after publishing contract version **${version}**.\n\nThis PR synchronizes the README's current-version references with pom.xml. The publication workflow skips redeployment for this documentation-only merge.`
              });
              core.info(`Created README synchronization PR #${pr.number}.`);
            }

            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'ci.yml', ref: branch
            });
            core.info('Dispatched CI for the automated README PR branch.');

      - name: Delete stale KAN-17 bootstrap branch if present
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = 'heads/KAN-17-centralize-avro-contracts';

            try {
              await github.rest.git.getRef({ owner, repo, ref });
            } catch (error) {
              if (error.status === 404) {
                core.info('Stale bootstrap branch already absent.');
                return;
              }
              throw error;
            }

            await github.rest.git.deleteRef({ owner, repo, ref });

            try {
              await github.rest.git.getRef({ owner, repo, ref });
              core.setFailed('Stale bootstrap branch still exists after deletion.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Verified stale bootstrap branch deleted.');
            }
