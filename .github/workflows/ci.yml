name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4

      - name: Checkout pull request base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base-contracts

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test schemas and backward compatibility
        env:
          BASE_SCHEMA_DIR: ${{ github.event_name == 'pull_request' && format('{0}/.base-contracts/src/main/avro', github.workspace) || '' }}
        run: mvn -B test
