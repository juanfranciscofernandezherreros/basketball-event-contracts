name: auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge-green-pr:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open',
              head: `${owner}:${context.payload.workflow_run.head_branch}`,
              per_page: 100
            });
            const pr = prs.find(candidate => candidate.head.sha === headSha && !candidate.draft);
            if (!pr) return;

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, head_sha: headSha, event: 'pull_request', per_page: 100
            });
            const relevant = runs.filter(run => run.name !== 'auto-merge');
            if (relevant.some(run => run.status !== 'completed')) return;
            const failed = relevant.filter(run => run.conclusion !== 'success');
            if (failed.length) {
              core.setFailed(failed.map(run => `${run.name}=${run.conclusion}`).join(', '));
              return;
            }

            const result = await github.rest.pulls.merge({
              owner, repo, pull_number: pr.number, merge_method: 'merge', sha: headSha
            });
            if (!result.data.merged) {
              core.setFailed(result.data.message || 'GitHub did not merge the pull request.');
              return;
            }

            if (pr.head.repo.full_name === `${owner}/${repo}` && pr.head.ref !== 'main') {
              const ref = `heads/${pr.head.ref}`;
              await github.rest.git.deleteRef({ owner, repo, ref });
              try {
                await github.rest.git.getRef({ owner, repo, ref });
                core.setFailed(`Branch ${ref} still exists after deletion.`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
