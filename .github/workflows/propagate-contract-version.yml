name: Propagate contract version

on:
  workflow_run:
    workflows: [Publish contracts]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Published version (blank uses pom.xml on main)
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: version
        name: Resolve published version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          value="$REQUESTED_VERSION"
          if [[ -z "$value" ]]; then
            value="$(python - <<'PY'
          import re
          from pathlib import Path
          match = re.search(r'<revision>\s*([^<]+)\s*</revision>', Path('pom.xml').read_text(encoding='utf-8'))
          if not match:
              raise SystemExit('No Maven revision found in pom.xml')
          print(match.group(1).strip())
          PY
          )"
          fi
          [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version: $value" >&2; exit 1; }
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "Propagating basketball-event-contracts $value"

  propagate:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repository:
          - csv-file-event-router
          - csv-fixtures-parser
          - csv-fixtures-persistence
          - csv-match-normalizer
          - csv-point-by-point-parser
          - csv-point-by-point-persistence
          - csv-results-parser
          - csv-results-persistence
          - csv-stats-match-parser
          - csv-stats-match-persistence
          - csv-stats-player-parser
          - csv-stats-player-persistence
          - csv-team-stats-parser
          - csv-team-stats-persistence
          - csv-watcher
    env:
      CONTRACT_VERSION: ${{ needs.prepare.outputs.version }}
      OWNER: ${{ github.repository_owner }}
      REPOSITORY: ${{ matrix.repository }}
      GH_TOKEN: ${{ secrets.CONTRACTS_SYNC_TOKEN }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify automation credentials
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo "Set CONTRACTS_SYNC_TOKEN with write access to all consumer repositories." >&2; exit 1; }
          [[ -n "$JIRA_BASE_URL" && -n "$JIRA_EMAIL" && -n "$JIRA_API_TOKEN" ]] || { echo "Set JIRA_BASE_URL, JIRA_EMAIL and JIRA_API_TOKEN repository secrets." >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repository }}
          ref: main
          path: consumer
          token: ${{ secrets.CONTRACTS_SYNC_TOKEN }}
      - id: inspect
        name: Check current consumer version
        run: |
          python .github/scripts/sync-contract-consumer.py \
            --mode inspect --pom consumer/pom.xml --readme consumer/README.md \
            --changelog consumer/CHANGELOG.md --contract-version "$CONTRACT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Report already synchronized repository
        if: steps.inspect.outputs.needs_update == 'false'
        run: echo "$REPOSITORY already consumes basketball-event-contracts $CONTRACT_VERSION"
      - name: Report repository already on a newer contract
        if: steps.inspect.outputs.needs_update == 'ahead'
        run: echo "$REPOSITORY consumes a newer contract than $CONTRACT_VERSION; no downgrade made"
      - id: jira
        name: Create Jira task and start it
        if: steps.inspect.outputs.needs_update == 'true'
        run: |
          summary="Update $REPOSITORY to basketball-event-contracts $CONTRACT_VERSION"
          description="Automatically update the dependency, patch release notes, run Java 21 tests, and merge after CI passes."
          payload="$(jq -n --arg summary "$summary" --arg description "$description" '{fields:{project:{key:"KAN"},issuetype:{name:"Task"},summary:$summary,description:{type:"doc",version:1,content:[{type:"paragraph",content:[{type:"text",text:$description}]}]}}}')"
          issue="$(curl --fail-with-body --silent --show-error -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json' -X POST "$JIRA_BASE_URL/rest/api/3/issue" --data "$payload" | jq -r '.key')"
          [[ "$issue" == KAN-* ]] || { echo "Jira did not return an issue key: $issue" >&2; exit 1; }
          transition="$(curl --fail-with-body --silent --show-error -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' "$JIRA_BASE_URL/rest/api/3/issue/$issue/transitions" | jq -r '[.transitions[] | select(.to.name == "En curso")][0].id // empty')"
          [[ -n "$transition" ]] || { echo "No Jira transition to En curso for $issue" >&2; exit 1; }
          curl --fail-with-body --silent --show-error -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json' -X POST "$JIRA_BASE_URL/rest/api/3/issue/$issue/transitions" --data "$(jq -n --arg id "$transition" '{transition:{id:$id}}')" >/dev/null
          echo "key=$issue" >> "$GITHUB_OUTPUT"
      - name: Update dependency, service patch and release notes
        if: steps.inspect.outputs.needs_update == 'true'
        run: |
          python .github/scripts/sync-contract-consumer.py \
            --mode apply --pom consumer/pom.xml --readme consumer/README.md \
            --changelog consumer/CHANGELOG.md --contract-version "$CONTRACT_VERSION" \
            --issue "${{ steps.jira.outputs.key }}"
      - name: Set up Java 21 and GitHub Packages access
        if: steps.inspect.outputs.needs_update == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: consumer/pom.xml
          server-id: github
          server-username: ${{ github.repository_owner }}
          server-password: ${{ secrets.CONTRACTS_SYNC_TOKEN }}
      - name: Test consumer
        if: steps.inspect.outputs.needs_update == 'true'
        working-directory: consumer
        run: mvn -B test
      - id: branch
        name: Commit and push consumer branch
        if: steps.inspect.outputs.needs_update == 'true'
        working-directory: consumer
        env:
          ISSUE_KEY: ${{ steps.jira.outputs.key }}
        run: |
          branch="bot/${ISSUE_KEY,,}-contracts-${CONTRACT_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add pom.xml README.md CHANGELOG.md
          git commit -m "$ISSUE_KEY update contracts to $CONTRACT_VERSION"
          git push --set-upstream origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - id: pr
        name: Open consumer pull request
        if: steps.inspect.outputs.needs_update == 'true'
        env:
          ISSUE_KEY: ${{ steps.jira.outputs.key }}
        run: |
          url="$(gh pr create --repo "$OWNER/$REPOSITORY" --base main --head "${{ steps.branch.outputs.name }}" \
            --title "$ISSUE_KEY update contracts to $CONTRACT_VERSION" \
            --body "$ISSUE_KEY updates basketball-event-contracts to $CONTRACT_VERSION, bumps the service patch, updates README/CHANGELOG, and passes Maven tests with Java 21.")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
      - id: checks
        name: Wait for all pull request checks to pass
        if: steps.inspect.outputs.needs_update == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          sha="$(gh pr view "$PR_NUMBER" --repo "$OWNER/$REPOSITORY" --json headRefOid --jq .headRefOid)"
          deadline=$((SECONDS + 3600))
          total=0
          pending=1
          while (( SECONDS < deadline )); do
            checks="$(gh api "repos/$OWNER/$REPOSITORY/commits/$sha/check-runs")"
            total="$(jq '.total_count' <<< "$checks")"
            if (( total > 0 )); then
              pending="$(jq '[.check_runs[] | select(.status != "completed")] | length' <<< "$checks")"
              failures="$(jq '[.check_runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length' <<< "$checks")"
              if (( failures > 0 )); then jq -r '.check_runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")) | "failed: \(.name) (\(.conclusion))"' <<< "$checks"; exit 1; fi
              if (( pending == 0 )); then echo "All $total checks passed on $sha"; echo "sha=$sha" >> "$GITHUB_OUTPUT"; break; fi
            fi
            sleep 10
          done
          (( SECONDS < deadline )) || { echo "Timed out waiting for checks on $sha" >&2; exit 1; }
          (( total > 0 && pending == 0 )) || { echo "No successful checks were reported for $sha" >&2; exit 1; }
      - name: Merge pull request and delete its branch
        if: steps.inspect.outputs.needs_update == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CHECKED_SHA: ${{ steps.checks.outputs.sha }}
        run: |
          current_sha="$(gh pr view "$PR_NUMBER" --repo "$OWNER/$REPOSITORY" --json headRefOid --jq .headRefOid)"
          [[ "$current_sha" == "$CHECKED_SHA" ]] || { echo "PR head changed after checks: $CHECKED_SHA -> $current_sha" >&2; exit 1; }
          gh pr merge "$PR_NUMBER" --repo "$OWNER/$REPOSITORY" --merge --delete-branch
      - name: Finish Jira task
        if: steps.inspect.outputs.needs_update == 'true'
        env:
          ISSUE_KEY: ${{ steps.jira.outputs.key }}
        run: |
          transition="$(curl --fail-with-body --silent --show-error -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/transitions" | jq -r '[.transitions[] | select(.to.name == "Finalizado")][0].id // empty')"
          [[ -n "$transition" ]] || { echo "No Jira transition to Finalizado for $ISSUE_KEY" >&2; exit 1; }
          curl --fail-with-body --silent --show-error -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json' -X POST "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/transitions" --data "$(jq -n --arg id "$transition" '{transition:{id:$id}}')" >/dev/null
          echo "$ISSUE_KEY finalized after merge"
